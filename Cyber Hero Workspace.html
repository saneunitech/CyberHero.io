<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cyber Hero Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky hero bar on top; left rail of missions grouped by day (a scrolling chip strip on phones); one mission panel at a time. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#14233b; --muted:#566883; --line:#d6deec;
  --accent:#1f4fd1; --accent-ink:#ffffff; --gold:#f5b301; --gold-ink:#3a2a00;
  --good:#17784a; --good-bg:#e3f5eb; --bad:#b3302a; --bad-bg:#fbe8e6; --tint:#e8eefc;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1628; --surface:#15233b; --ink:#e8eefb; --muted:#9bb0cd; --line:#2a3c5a;
  --accent:#8fb0ff; --accent-ink:#0d1628; --gold:#f5b301; --gold-ink:#2b1f00;
  --good:#6fd6a0; --good-bg:#123325; --bad:#ff9a92; --bad-bg:#3a1a19; --tint:#1c2f52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1628; --surface:#15233b; --ink:#e8eefb; --muted:#9bb0cd; --line:#2a3c5a;
  --accent:#8fb0ff; --accent-ink:#0d1628; --gold:#f5b301; --gold-ink:#2b1f00;
  --good:#6fd6a0; --good-bg:#123325; --bad:#ff9a92; --bad-bg:#3a1a19; --tint:#1c2f52; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:clamp(1.6rem,4vw,2.1rem)}
h3{font-size:1.15rem;margin-top:22px}
p{margin:.5em 0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ink);color:#fff;
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:.01em}
.brand b{color:var(--gold)}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.id{font-family:var(--f-mono);background:rgba(255,255,255,.14);padding:2px 8px;border-radius:6px}
.prog{display:flex;align-items:center;gap:8px;min-width:150px}
.prog .track{flex:1;height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;min-width:70px}
.prog .fill{height:100%;background:var(--gold);width:0;transition:width .3s}
.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:4px 10px}
.ghost:hover{background:rgba(255,255,255,.12)}
.saved{font-size:.8rem;opacity:.85}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-top:24px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 110px);overflow:auto}
.dayh{font-family:var(--f-display);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:14px 0 4px;padding-left:6px}
.dayh:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);padding:8px 10px;border-radius:10px;line-height:1.25}
.nav:hover{background:var(--tint)}
.nav[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:800}
.dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800}
.nav.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.nav[aria-current="true"] .dot{border-color:currentColor}
.panel{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3.5vw,34px)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.78rem;background:var(--gold);color:var(--gold-ink);padding:2px 9px;border-radius:99px;font-weight:700;margin-bottom:8px}
.lead{font-size:1.08rem;color:var(--muted)}
.big{background:var(--tint);border-radius:12px;padding:12px 16px;margin:14px 0;font-weight:700}
ul.clean{padding-left:1.2em;margin:.4em 0}
ul.clean li{margin:.25em 0}

/* inputs */
.in{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 12px}
textarea.in{resize:vertical;min-height:84px}
.in:focus{border-color:var(--accent);outline:none}
.sel{width:auto;min-width:170px;max-width:100%}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(90px,auto);gap:8px 14px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}
.row .fb{font-weight:800;font-size:.9rem}
.row.ok{background:var(--good-bg);border-color:var(--good)} .row.ok .fb{color:var(--good)}
.row.no{background:var(--bad-bg);border-color:var(--bad)} .row.no .fb{color:var(--bad)}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.card q{display:block;font-weight:700;margin-bottom:8px;quotes:none}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 2px;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.rg{display:flex;flex-wrap:wrap;gap:8px}
.rg label{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border:2px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg);flex:1 1 220px;min-width:0}
.rg label:has(input:checked){border-color:var(--accent);background:var(--tint)}
.rg input{accent-color:var(--accent);margin-top:4px;width:18px;height:18px;flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fl{display:block;font-weight:800;margin:12px 0 4px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--tint)}
.scroll{overflow-x:auto}
.meter{font-family:var(--f-mono);font-size:1.05rem;padding:10px 14px;border-radius:10px;background:var(--bg);border:2px dashed var(--line);margin-top:10px;word-break:break-all}
.meter.good{border-color:var(--good);color:var(--good)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 20px;font-weight:800}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:var(--tint);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.warn{border-left:5px solid var(--gold);background:var(--tint);padding:10px 14px;border-radius:0 10px 10px 0;margin:14px 0}

/* login */
.login{max-width:520px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,34px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{font-family:var(--f-mono);background:var(--tint);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.err{color:var(--bad);font-weight:700;min-height:1.4em}

/* portfolio */
.pf-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pf-sec{margin-top:22px}
.pf-sec h3{margin:0 0 6px;border-bottom:2px solid var(--gold);padding-bottom:4px;display:inline-block}
.pf-row{display:grid;grid-template-columns:minmax(120px,36%) minmax(0,1fr);gap:4px 14px;padding:4px 0;border-bottom:1px dotted var(--line)}
.pf-row dt{color:var(--muted);font-weight:700} .pf-row dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px;gap:6px}
  .rail .dayh{flex:none;margin:0;align-self:center;padding:0 4px 0 8px;white-space:nowrap}
  .nav{flex:none;width:auto;white-space:nowrap;border:1px solid var(--line)}
  .row{grid-template-columns:minmax(0,1fr)}
  .prog{min-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var LS = "cyberhero27:";

/* ---------- storage (kept on this device's browser) ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
var mem = {};            /* fallback when storage is blocked */
var S = null;            /* current hero: {id,name,a,done,created} */
var cur = "start";
var storageOK = lsSet(LS+"probe","1");

function ids(){ try{ return JSON.parse(lsGet(LS+"ids")||"[]"); }catch(e){ return []; } }
function loadHero(id){
  var raw = storageOK ? lsGet(LS+"h:"+id) : mem[id];
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
var saveTimer = null;
function persist(){
  if(!S) return;
  var raw = JSON.stringify(S);
  if(storageOK){
    var ok = lsSet(LS+"h:"+S.id, raw);
    var list = ids(); if(list.indexOf(S.id)<0){ list.push(S.id); lsSet(LS+"ids",JSON.stringify(list)); }
    setSaved(ok);
  } else { mem[S.id]=raw; setSaved(false); }
}
function schedule(){ clearTimeout(saveTimer); setSaved(null); saveTimer=setTimeout(persist,350); }
function setSaved(ok){
  var el=document.getElementById("saved"); if(!el) return;
  if(ok===null){ el.textContent="Saving..."; return; }
  var t=new Date(); var hh=("0"+t.getHours()).slice(-2)+":"+("0"+t.getMinutes()).slice(-2);
  el.textContent = ok ? "Saved at "+hh : "Not saved: storage is blocked on this browser";
}

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function A(k){ return S.a[k]; }
var F = {
  t:function(k,ph,r){ return '<textarea class="in" data-k="'+k+'" rows="'+(r||3)+'" placeholder="'+esc(ph||"")+'" aria-label="'+esc(ph||k)+'"></textarea>'; },
  i:function(k,ph){ return '<input class="in" data-k="'+k+'" placeholder="'+esc(ph||"")+'" aria-label="'+esc(ph||k)+'" autocomplete="off">'; },
  c:function(k,l,g){ return '<label class="chk"><input type="checkbox" data-k="'+k+'"'+(g?' data-group="'+g+'"':'')+'><span>'+l+'</span></label>'; },
  s:function(k,opts,ans,label){ return '<select class="in sel" data-k="'+k+'"'+(ans?' data-ans="'+ans+'"':'')+' aria-label="'+esc(label||k)+'"><option value="">Choose...</option>'+opts.map(function(o){return '<option value="'+o+'">'+o+'</option>';}).join("")+'</select>'; },
  r:function(k,opts){ return '<div class="rg" role="radiogroup">'+opts.map(function(o){return '<label><input type="radio" name="'+k+'" data-k="'+k+'" value="'+o[0]+'"><span>'+o[1]+'</span></label>';}).join("")+'</div>'; }
};
function sortRow(k,text,ans,opts){ return '<div class="row"><span>'+text+'</span>'+F.s(k,opts,ans,text)+'<span class="fb"></span></div>'; }

function heroCheck(prefix){
  return QS.map(function(q,i){
    var L="ABCD";
    return '<div class="card"><q>'+(i+1)+'. '+esc(q[0])+'</q>'+F.r(prefix+".q"+(i+1), q[1].map(function(o,j){return [L[j],L[j]+". "+esc(o)];}))+'</div>';
  }).join("");
}
function score(prefix){
  var n=0,any=false;
  QS.forEach(function(q,i){ var v=A(prefix+".q"+(i+1)); if(v){any=true;} if(v===q[2]) n++; });
  return any ? n : null;
}

 {id:"m4",day:2,title:"4. Scam Spotters",tag:"Mission 4",
  sum:[["Card 1: prize message","m4.c1"],["Card 2: homework photo in class group","m4.c2"],["Card 3: send K10 get K100","m4.c3"],["Card 4: free game coins","m4.c4"],["Card 5: account deleted in 1 hour","m4.c5"],["Card 6: aunty at the gate","m4.c6"],["My practice scam message and its red flags","m4.own"]],
  html:function(){ return '<span class="tag">Mission 4</span><h2>Scam Spotters</h2><p class="lead">Spot a scam before it spots you. Scammers try to trick you into giving away secrets, credit or money.</p>'+

   '<h3>Real or Scam?</h3>'+
   sortRow("m4.c1","Card 1: \"CONGRATULATIONS! You won a phone. Click here and type your Facebook password today only!\"","Scam",RS)+
   sortRow("m4.c2","Card 2: Your teacher posts the homework photo in the official class group. No link and no request.","Real",RS)+
   sortRow("m4.c3","Card 3: \"Send me K10 credit now and I will send you K100 back.\"","Scam",RS)+
   sortRow("m4.c4","Card 4: In a game chat: \"Free 5,000 coins! Give me your login and I'll add them.\"","Scam",RS)+
   sortRow("m4.c5","Card 5: \"Your account will be deleted in 1 hour unless you send the code we just texted you.\"","Scam",RS)+
   sortRow("m4.c6","Card 6: Your aunty, from her saved number: \"Come to the gate, I am outside the school.\" (If you are unsure, call her on a number you know.)","Real",RS)+
   '<div class="big">When I see a scam: STOP. Do not click. Tell a grown-up.</div>'+
   '<label class="fl" for="t6">My own practice scam message. Circle its red flags by writing them below it. (Never send it.)</label>'+F.t("m4.own","Write your practice scam message here",4)+
   '<p>Practice game: <a href="https://beinternetawesome.withgoogle.com/en_us/interland" target="_blank" rel="noopener">Interland: Reality River</a></p>'+finishBar("m4"); }},

 {id:"m5",day:2,title:"5. Real or Fake?",tag:"Mission 5",

  html:function(){ return '<span class="tag">Mission 5</span><h2>Real or Fake?</h2><p class="lead">Computers can now make pictures, voices and videos that look real. Some of them are fake.</p>'+

   '<h3>What would I do first?</h3><p>Pick the first step for each claim. There can be more than one good answer, so tell us why in the box below.</p>'+
   sortRow("m5.k1","\"Share this post and everyone gets free data.\"","",["Stop","Check","Ask"])+
   sortRow("m5.k2","A video shows a famous person saying something shocking.","",["Stop","Check","Ask"])+
   sortRow("m5.k3","A message says school is closed tomorrow.","",["Stop","Check","Ask"])+
   sortRow("m5.k4","A photo of a giant snake in town.","",["Stop","Check","Ask"])+
   '<label class="fl" for="t7">How my team checked one claim: who posted it, are trusted sources reporting it, is anything odd?</label>'+F.t("m5.how","Our team checked by...",3)+

   '<label class="fl" for="t8">My idea for a family safe word (do not write the real one here!)</label>'+F.i("m5.safe","For example: a type of fruit plus a number")+finishBar("m5"); }},

 {id:"m6",day:2,title:"6. AI Explorer",tag:"Mission 6",
  sum:[["SAFE-AI: S stands for","m6.s"],["SAFE-AI: A stands for","m6.a"],["SAFE-AI: F stands for","m6.f"],["SAFE-AI: E stands for","m6.e"],["Prompt WHO","m6.who"],["Prompt WHAT","m6.what"],["Prompt HOW","m6.how"],["Prompt LIMITS","m6.limits"],["Mistake our team found in the AI answer","m6.bug"],["Our team","m6.team"],["Our artefact","m6.type"],["Our artefact plan","m6.plan"],["Artefact review checks done","m6.rv","rv"],["The mistake or odd thing AI made in our artefact","m6.oops"],["3 things we changed in our own words","m6.chg","chg"],["Label added: Made with AI help","m6.label","bool"],["AI to explain a hard idea","m6.l1"],["AI to do my test for me","m6.l2"],["AI to quiz me before an exam","m6.l3"],["AI to make a fake picture of a classmate","m6.l4"],["My AI promise","m6.promise"]],

   '<div class="big">AI is a computer program that learned patterns from lots of examples. It guesses what comes next. It does not know things the way you do, so it can be confidently wrong.</div>'+
   '<p>Where AI hides: phone keyboard suggestions, video recommendations, translation, voice assistants.</p>'+
   '<h3>The SAFE-AI rules</h3><p>Match each letter to its rule.</p>'+
   sortRow("m6.s","S","Secrets stay secret",["Secrets stay secret","Ask a grown-up","Fact-check","Explain in my own words"])+
   sortRow("m6.a","A","Ask a grown-up",["Secrets stay secret","Ask a grown-up","Fact-check","Explain in my own words"])+
   sortRow("m6.f","F","Fact-check",["Secrets stay secret","Ask a grown-up","Fact-check","Explain in my own words"])+
   sortRow("m6.e","E","Explain in my own words",["Secrets stay secret","Ask a grown-up","Fact-check","Explain in my own words"])+
   '<p>Many AI tools are for ages 13 and up, so use AI only with a grown-up or on a screen your facilitator manages. Never tell an AI your name, school, address or password.</p>'+
   '<h3>The WHO, WHAT, HOW, LIMITS prompt recipe</h3><p>Vague: "Tell me about rain." Clear: "You are a science teacher. Explain how rain forms to a 10-year-old in five short sentences with one example."</p>'+
   '<label class="fl" for="w1">WHO should the AI be?</label>'+F.i("m6.who","a science teacher")+
   '<label class="fl" for="w2">WHAT do I want?</label>'+F.i("m6.what","explain how rain forms")+
   '<label class="fl" for="w3">HOW should the answer look?</label>'+F.i("m6.how","five short sentences for a 10-year-old")+
   '<label class="fl" for="w3b">LIMITS: what must it keep kind, short and safe?</label>'+F.i("m6.limits","keep it kind and short, no real names")+
   '<div class="warn">Before you send a prompt, check: no secrets, a grown-up has looked at it, and I will fact-check the answer.</div>'+
   '<h3>Fact-Check Lab</h3><label class="fl" for="w4">The mistake our team found in the AI answer, and how we checked it</label>'+F.t("m6.bug","The mistake was... We checked in...",3)+
   '<h3>Artefact Studio</h3><p class="lead">An artefact is something you make. AI is your helper and you are the boss. Your team picks one: a Hero Safety Poster, a quiz for a younger child, a comic or story, or a "Be Safe Online" web page.</p>'+
   '<label class="fl" for="at1">Our team name</label>'+F.i("m6.team","Team name")+
   '<label class="fl" for="at2">Our artefact</label>'+F.s("m6.type",["A. Hero Safety Poster","B. Quiz for a younger child","C. Comic or story","D. Be Safe Online web page"],"","Our artefact")+
   '<h3>Step 1. Plan</h3><label class="fl" for="at3">Who is it for? What will it teach? What will AI do? What will we do ourselves?</label>'+F.t("m6.plan","It is for... It teaches... AI will... We will...",3)+
   '<h3>Step 2. Prompt</h3><p>Use WHO, WHAT, HOW and LIMITS from above. Your facilitator checks your prompt before it is sent.</p>'+

   F.c("m6.r1","Nothing in it is wrong or made up")+F.c("m6.r2","Nothing in it is unkind or scary")+F.c("m6.r3","It has no real names, schools or other personal details")+F.c("m6.r4","We checked the facts in a book or a trusted source")+
   '<label class="fl" for="at4">The mistake or odd thing AI made was</label>'+F.t("m6.oops","AI got this wrong...",2)+
   '<h3>Step 4. Make it ours</h3><p>Change at least 3 things in your own words, and add your own drawing or idea.</p>'+

   F.c("m6.label","We wrote the label on our artefact: Made by our team with AI help.")+

 {id:"m7",day:3,title:"7. Code Cadets",tag:"Mission 7",

  html:function(){ return '<span class="tag">Mission 7</span><h2>Code Cadets</h2><p class="lead">Write your first program and build the Hero Quiz Game in Scratch.</p>'+
   '<h3>Words to know</h3><ul class="clean"><li><b>Algorithm:</b> a set of steps to get something done</li><li><b>Program:</b> instructions a computer can follow</li><li><b>Bug:</b> a mistake in a program</li><li><b>Sequence:</b> steps in order</li><li><b>Loop:</b> repeats steps</li><li><b>Condition:</b> if this is true, do that, else do something else</li><li><b>Variable:</b> a box that holds a number or word, like a score</li></ul>'+
   '<label class="fl" for="c0">Robot Hero: write the steps to make your robot reach the hidden object</label>'+F.t("m7.robot","Step 1... Step 2...",3)+
   '<h3>Build the Hero Quiz Game</h3><p>Open <a href="https://scratch.mit.edu/projects/editor/" target="_blank" rel="noopener">Scratch</a> (from MIT, free). Save your game as <b>'+esc(S.id)+'_HeroGame</b> using File, then Save to your computer. Tick each step when it works.</p>'+
   F.c("m7.d1","<b>Step 1, sequence:</b> pick a backdrop and a Hero sprite. When the green flag is clicked, say \"Welcome, Cyber Hero!\" for 2 seconds.")+
   F.c("m7.d2","<b>Step 2, variable:</b> make a variable called score and set it to 0 at the start.")+
   F.c("m7.d3","<b>Step 3, condition:</b> ask \"Is your home address safe to share? (yes or no)\". If the answer is no, say \"Correct!\" and change score by 1. Else say \"Remember: keep it secret!\"")+
   F.c("m7.d4","<b>Step 4, more questions and a loop:</b> add three more safety questions. At the end make a celebration with repeat 10: turn 15 degrees.")+
   F.c("m7.d5","<b>Step 5, test and finish:</b> run the game and say your final score.")+
   '<h3>Code check: where did I use each idea?</h3>'+
   '<label class="fl" for="u1">Sequence</label>'+F.i("m7.u1","Where in my game?")+'<label class="fl" for="u2">Variable</label>'+F.i("m7.u2","Where in my game?")+'<label class="fl" for="u3">Condition</label>'+F.i("m7.u3","Where in my game?")+'<label class="fl" for="u4">Loop</label>'+F.i("m7.u4","Where in my game?")+
   '<h3>Bug hunt</h3><label class="fl" for="bg">My bug was... I fixed it by...</label>'+F.t("m7.bug","My bug was... I fixed it by...",3)+
   '<h3>AI as a coding helper</h3><p>Ask the AI to explain the bug and give a hint, not to rewrite the whole game. A person must always test the code.</p>'+

 {id:"m8",day:3,title:"8. Kind and Brave",tag:"Mission 8",
  sum:[["If a friend posts a mean picture of a classmate, I would","m8.q1"],["If someone online says keep our chat a secret, I would","m8.q2"],["My trusted adults","m8.ta","list"],["My kind message for someone today","m8.kind"]],
  html:function(){ return '<span class="tag">Mission 8</span><h2>Kind and Brave</h2><p class="lead">Being kind online is a superpower. Being brave means helping, not joining in.</p>'+

   '<h3>What would a Cyber Hero do?</h3>'+
   '<div class="card"><q>A friend posts a mean picture of a classmate in the group chat.</q>'+F.r("m8.q1",[["Join in and laugh","Join in and laugh"],["Save proof, block or report it, and tell a trusted adult","Save proof, block or report it, and tell a trusted adult"],["Say nothing","Say nothing"]])+'</div>'+
   '<div class="card"><q>Someone online says, "Keep our chat a secret from your parents."</q>'+F.r("m8.q2",[["Keep it secret","Keep it secret"],["Tell a trusted adult right away","Tell a trusted adult right away"],["Chat with them more","Chat with them more"]])+'</div>'+
   '<div class="big">If anyone online asks for secrets, pictures of your body, to chat privately somewhere else, or tells you not to tell, that is not okay. It is never your fault. Tell a trusted adult straight away. You will not be in trouble for telling.</div>'+

   [1,2,3,4,5].map(function(n){return '<label class="fl" for="ta'+n+'">Finger '+n+'</label>'+F.i("m8.ta"+n,"A trusted adult");}).join("")+

var DAYS = {1:"Day 1: Type and Protect",2:"Day 2: Spot and Check",3:"Day 3: Build and Lead"};

/* ---------- portfolio ---------- */
function fmtRow(it,row){
  var k=row[1], kind=row[2], v;
  if(k==="@pre"||k==="@post"){ var s=score(k==="@pre"?"pre":"post"); return s==null?"":s+" out of 15"; }
  if(kind==="count4"){ var n=0; for(var i=1;i<=4;i++) if(A("m3.p"+i)) n++; return n?n+" of 4":""; }
  if(kind==="rv"){ var q=0; for(var r=1;r<=4;r++) if(A("m6.r"+r)) q++; return q?q+" of 4":""; }
  if(kind==="chg"){ var ch=[]; for(var c=1;c<=3;c++){ var cv=A("m6.ch"+c); if(cv) ch.push(c+". "+cv); } return ch.join("\n"); }
  if(kind==="bool") return A(k)?"Yes":"";
  if(kind==="list"){ var out=[]; for(var j=1;j<=5;j++){ var x=A(k+j); if(x) out.push(x); } return out.join("\n"); }
  if(kind==="promises"||kind==="habits"){
    var P = kind==="promises" ? ["I will use long, strong, different passphrases.","I will keep my private things private.","I will ask a grown-up first before I share a photo or sign up for something.","I will use Stop, Check, Ask before I share.","I will tell a trusted adult when something feels wrong.","I will be kind online."]
                              : ["Screens off one hour before sleep.","Homework first, games after.","A short break every 30 minutes.","Ask before using AI for homework, and tell my teacher.","Keep my devices charged and safe for school.","Visit the American Space library to learn something new."];
    var pre = kind==="promises" ? "m9.pr" : "m9.hb", r=[];
    P.forEach(function(t,i){ if(A(pre+(i+1))) r.push(t); });
    return r.join("\n");
  }
  v=A(k); return v==null?"":String(v);
}
function portfolioBody(){
  var html="";
  ITEMS.forEach(function(it){
    if(!it.sum.length) return;
    var rows=it.sum.map(function(r){ var v=fmtRow(it,r); return v?'<div class="pf-row"><dt>'+esc(r[0])+'</dt><dd>'+esc(v)+'</dd></div>':""; }).join("");
    if(!rows) return;
    html+='<div class="pf-sec"><h3>'+esc(it.title)+'</h3><dl style="margin:0">'+rows+'</dl></div>';
  });
  return html || '<p>Your portfolio will fill up as you finish missions.</p>';
}

/* ---------- download via the viewer's save prompt ---------- */
var downloadsNS = undefined;
function getDownloads(cb){
  if(downloadsNS!==undefined) return cb(downloadsNS);
  try{
    if(window.claude && window.claude.use){
      window.claude.use("downloads").then(function(d){ downloadsNS=d||null; cb(downloadsNS); },function(){ downloadsNS=null; cb(null); });
      return;
    }
  }catch(e){}
  downloadsNS=null; cb(null);
}
function saveFile(name,data,msgId){
  var m=document.getElementById(msgId);
  getDownloads(function(d){
    if(!d){ if(m) m.textContent="Saving files is not available here. Ask your facilitator to help you print."; return; }
    d.save({filename:name,data:data}).then(function(){ if(m) m.textContent="Saved. Look in your Downloads folder."; },
      function(err){ if(!m) return; m.textContent = (err&&err.code==="declined") ? "No problem. Tap the button again when you are ready." : "Could not save the file. Ask your facilitator for help."; });
  });
}

/* ---------- rendering ---------- */
function render(){
  var app=document.getElementById("app");
  if(!S){ renderLogin(app); return; }
  var total=ITEMS.length-1, d=0; ITEMS.forEach(function(it){ if(it.id!=="portfolio"&&done(it.id)) d++; });
  var nav=""; var lastDay=0;
  ITEMS.forEach(function(it){
    if(it.day!==lastDay){ nav+='<div class="dayh">'+DAYS[it.day]+'</div>'; lastDay=it.day; }
    nav+='<button class="nav'+(done(it.id)?" done":"")+'" data-go="'+it.id+'"'+(it.id===cur?' aria-current="true"':"")+'><span class="dot">'+(done(it.id)?"&#10003;":"")+'</span><span>'+esc(it.title)+'</span></button>';
  });
  var item=ITEMS.filter(function(i){return i.id===cur;})[0]||ITEMS[0];
  app.innerHTML='<div class="bar"><div class="wrap"><div class="brand">Cyber <b>Hero</b> Workspace</div>'+
    '<div class="who"><span class="id">'+esc(S.id)+'</span><span>'+esc(S.name||"")+'</span><span class="saved" id="saved" aria-live="polite"></span><button class="ghost" id="switch">Switch Hero</button></div>'+
    '<div class="prog" aria-label="Progress"><span class="saved">'+d+' of '+total+'</span><div class="track"><div class="fill" style="width:'+Math.round(d/total*100)+'%"></div></div></div></div></div>'+
    '<div class="wrap shell"><nav class="rail" aria-label="Missions">'+nav+'</nav><main class="panel" id="panel">'+item.html()+'</main></div>';
  restore();
  wireLive();
  var cn=document.querySelector(".nav[aria-current]"); if(cn&&cn.scrollIntoView&&window.innerWidth<=820){ try{cn.scrollIntoView({inline:"center",block:"nearest"});}catch(e){} }
}
function restore(){
  var panel=document.getElementById("panel");
  panel.querySelectorAll("[data-k]").forEach(function(el){
    var k=el.dataset.k, v=S.a[k];
    if(el.type==="radio") el.checked=(v===el.value);
    else if(el.type==="checkbox") el.checked=!!v;
    else el.value=(v==null?"":v);
    if(el.dataset.ans) fb(el);
  });
  counts();
}
function fb(el){
  var row=el.closest(".row"); if(!row) return;
  var f=row.querySelector(".fb"); row.classList.remove("ok","no");
  if(!el.value){ f.textContent=""; return; }
  var ok = el.value===el.dataset.ans;
  row.classList.add(ok?"ok":"no"); f.textContent=ok?"Correct":"Try again";
}
function counts(){
  ["pr","hb"].forEach(function(g){
    var el=document.getElementById(g==="pr"?"prcount":"hbcount"); if(!el) return;
    var n=document.querySelectorAll('[data-group="'+g+'"]:checked').length;
    el.textContent=n+" of 3 picked";
  });
}
function wireLive(){
  /* passphrase builder: never saved, only its length */
  var pw=["pw1","pw2","pw3","pwn"].map(function(i){return document.getElementById(i);});
  if(pw[0]){
    var upd=function(){
      var w=[pw[0].value.trim(),pw[1].value.trim(),pw[2].value.trim()].filter(Boolean);
      var n=pw[3].value.trim(); var p=w.concat(n?[n]:[]).join("-");
      var out=document.getElementById("pwout");
      if(!p){ out.textContent="Type your words above"; out.className="meter"; return; }
      var strong = p.length>=12 && w.length>=3 && !!n;
      out.className="meter"+(strong?" good":"");
      out.textContent=p.replace(/[^-]/g,"*")+"  |  "+p.length+" characters  |  "+(strong?"Long and strong!":"Add more words or a number to reach 12 characters");
      S.a["m2.len"]=p.length; schedule();
    };
    pw.forEach(function(e){ e.addEventListener("input",upd); });
  }
  /* typing practice */
  var tp=document.getElementById("tp");
  if(tp){
    tp.addEventListener("input",function(){
      var tgt=document.getElementById("tptarget").textContent, v=tp.value, ok=0;
      for(var i=0;i<v.length&&i<tgt.length;i++) if(v[i]===tgt[i]) ok++;
      var out=document.getElementById("tpout");
      var acc=v.length?Math.round(ok/Math.max(v.length,1)*100):0;
      out.textContent=v.length+" of "+tgt.length+" characters  |  Accuracy "+acc+"%"+(v.length>=tgt.length?(acc>=95?"  |  Great typing!":"  |  Try again for fewer mistakes"):"");
      out.className="meter"+(v.length>=tgt.length&&acc>=95?" good":"");
      if(v.length>=tgt.length){ S.a["m3.acc"]=acc; schedule(); }
    });
  }
  var dl=document.getElementById("dlpf"); if(dl) dl.onclick=function(){ saveFile(S.id+"_Hero_Portfolio.html",printableDoc(),"dlmsg"); };
  var dj=document.getElementById("dljson"); if(dj) dj.onclick=function(){ saveFile(S.id+"_Hero_Backup.json",JSON.stringify(S,null,1),"dlmsg"); };
}
function go(id){ persist(); cur=id; render(); window.scrollTo(0,0); }

/* ---------- login ---------- */
function renderLogin(app,msg){
  var list=ids();
  app.innerHTML='<div class="login"><h1 style="font-size:2rem">Cyber <span style="color:var(--accent)">Hero</span> Workspace</h1><p class="lead">'+esc(CONFIG.program)+'</p>'+
   '<form id="lf" autocomplete="off"><label class="fl" for="hid">My Hero ID (on my name tag)</label><input class="in" id="hid" placeholder="For example CH1-07" maxlength="12" style="text-transform:uppercase">'+
   '<label class="fl" for="hnm">My Hero Name (a nickname, not my full name)</label><input class="in" id="hnm" placeholder="For example Captain Pita" maxlength="24">'+
   '<div class="err" id="lerr" role="alert">'+(msg?esc(msg):"")+'</div><button class="btn" type="submit">Start or continue</button></form>'+
   (list.length?'<p style="margin-top:20px" class="saved">Heroes who have used this computer. Tap your ID:</p><div class="chips">'+list.map(function(i){return '<button type="button" data-pick="'+esc(i)+'">'+esc(i)+'</button>';}).join("")+'</div>':"")+
   (storageOK?"":'<div class="warn">This browser is blocking saving, so your work will be lost when you close the page. Ask your facilitator for help.</div>')+
   '<div class="warn">Your work is saved on this computer in this browser. Use the same computer each morning.</div></div>';
  document.getElementById("lf").addEventListener("submit",function(e){
    e.preventDefault();
    var id=document.getElementById("hid").value.trim().toUpperCase(), nm=document.getElementById("hnm").value.trim();
    if(!/^[A-Z0-9-]{3,12}$/.test(id)){ document.getElementById("lerr").textContent="Type the Hero ID from your name tag, using letters, numbers and dashes."; return; }
    start(id,nm);
  });
}
function start(id,nm){
  var h=loadHero(id);
  S = h || {id:id,name:"",a:{},done:{},created:Date.now()};
  if(nm) S.name=nm;
  persist();
  /* open at the first part not yet finished */
  cur="start"; for(var i=0;i<ITEMS.length;i++){ if(!done(ITEMS[i].id)){ cur=ITEMS[i].id; break; } }
  render();
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t) return;
  if(t.dataset.go){ go(t.dataset.go); }
  else if(t.dataset.pick){ var h=loadHero(t.dataset.pick); document.getElementById("hid").value=t.dataset.pick; document.getElementById("hnm").value=h&&h.name||""; document.getElementById("hnm").focus(); }
  else if(t.id==="switch"){ persist(); S=null; render(); }
  else if(t.dataset.done){
    var id=t.dataset.done; S.done[id]=!S.done[id]; persist();
    if(S.done[id]){ var i=ITEMS.map(function(x){return x.id;}).indexOf(id); cur=ITEMS[Math.min(i+1,ITEMS.length-1)].id; window.scrollTo(0,0); }
    render();
  }
});
function onEdit(e){
  var el=e.target, k=el.dataset&&el.dataset.k; if(!k||!S) return;
  if(el.type==="radio"){ if(el.checked) S.a[k]=el.value; }
  else if(el.type==="checkbox"){
    if(el.checked && el.dataset.group && el.dataset.group!=="pc" && document.querySelectorAll('[data-group="'+el.dataset.group+'"]:checked').length>3){ el.checked=false; counts(); return; }
    S.a[k]=el.checked; counts();
  } else { S.a[k]=el.value; }
  if(el.dataset.ans) fb(el);
  schedule();
}
document.addEventListener("input",onEdit);
document.addEventListener("change",onEdit);
window.addEventListener("pagehide",persist);

render();
</script>
